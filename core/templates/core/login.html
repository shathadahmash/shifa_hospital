<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Shifa Hospital</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-950 flex items-center justify-center p-6">

    <div class="w-full max-w-5xl grid lg:grid-cols-2 rounded-3xl overflow-hidden bg-white shadow-2xl">

        <div class="hidden lg:block relative">
            <img
                src="https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?q=80&w=1200&auto=format&fit=crop"
                class="h-full w-full object-cover"
                alt="Hospital"
            >
            <div class="absolute inset-0 bg-slate-950/40"></div>
            <div class="absolute bottom-10 left-10 text-white">
                <h1 class="text-4xl font-semibold">Shifa Hospital</h1>
                <p class="mt-3 text-white/80">Staff access portal</p>
            </div>
        </div>

        <div class="p-8 lg:p-12">
            <a href="/" class="text-sm text-slate-500 hover:text-slate-900">Back to home</a>

            <h2 class="mt-10 text-3xl font-semibold text-slate-900">Welcome back</h2>
            <p class="mt-2 text-slate-500">Login to access the hospital dashboard.</p>

            {% if form.errors %}
                <div class="mt-6 rounded-xl bg-red-50 text-red-700 px-4 py-3 text-sm">
                    Invalid username or password.
                </div>
            {% endif %}

            <form method="post" class="mt-8 space-y-5">
                {% csrf_token %}

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">Username</label>
                    <input
                        type="text"
                        name="username"
                        required
                        class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:ring-2 focus:ring-slate-900"
                    >
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">Password</label>
                    <input
                        type="password"
                        name="password"
                        required
                        class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:ring-2 focus:ring-slate-900"
                    >
                </div>

                <button
                    type="submit"
                    class="w-full rounded-xl bg-slate-950 text-white py-3 font-medium hover:bg-slate-800"
                >
                    Login
                </button>
            </form>

            <p class="mt-8 text-sm text-slate-500">
                Use your Django superuser account.
            </p>
        </div>

    </div>

</body>
</html>
